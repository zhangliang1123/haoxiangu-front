<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="100%" stop-color="#FFE9C7"/>
    </linearGradient>
    <linearGradient id="pomelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1D6"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>

  <!-- 柚子外圈 -->
  <circle cx="256" cy="268" r="178" fill="url(#pomelo)" stroke="#F28C28" stroke-width="10"/>
  <circle cx="256" cy="268" r="142" fill="#FFE8A3" stroke="#F4A261" stroke-width="8"/>

  <!-- 柚子瓣分隔线 -->
  <g stroke="#F4A261" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="140" x2="256" y2="396"/>
    <line x1="128" y1="268" x2="384" y2="268"/>
    <line x1="166" y1="178" x2="346" y2="358"/>
    <line x1="346" y1="178" x2="166" y2="358"/>
  </g>

  <!-- 中心白圆 -->
  <circle cx="256" cy="268" r="76" fill="#FFFFFF" opacity="0.96"/>

  <!-- 饭碗 -->
  <path d="M196 272 Q256 336 316 272 L304 300 Q256 344 208 300 Z"
        fill="url(#bowl)" stroke="#5C3D2E" stroke-width="8" stroke-linejoin="round"/>
  <path d="M196 272 Q256 292 316 272"
        fill="none" stroke="#5C3D2E" stroke-width="8" stroke-linecap="round"/>

  <!-- 米饭/食物 -->
  <path d="M214 266 Q256 238 298 266 Q256 284 214 266Z"
        fill="#FFFFFF" stroke="#5C3D2E" stroke-width="6"/>

  <!-- 筷子 -->
  <line x1="286" y1="210" x2="330" y2="258" stroke="#5C3D2E" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="202" x2="344" y2="250" stroke="#5C3D2E" stroke-width="8" stroke-linecap="round"/>

  <!-- 蒸汽 -->
  <path d="M238 230 C228 218 248 210 238 198" fill="none" stroke="#F28C28" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M268 226 C258 214 278 206 268 194" fill="none" stroke="#F28C28" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- 柚子叶 -->
  <path d="M256 90 C230 62 196 70 186 94 C216 100 242 102 256 90Z"
        fill="#3A9D5D" stroke="#2E7D4F" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 90 C282 62 316 70 326 94 C296 100 270 102 256 90Z"
        fill="#4CAF50" stroke="#2E7D4F" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 90 L256 128" stroke="#2E7D4F" stroke-width="8" stroke-linecap="round"/>
